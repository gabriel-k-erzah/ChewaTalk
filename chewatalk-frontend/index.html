<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,800&family=DM+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">

<header class="masthead wrap">
  <a class="identity" href="#/" aria-label="ChewaTalk home">
    <span class="logo-mascot" id="logo-mascot" aria-hidden="true"></span>
    <span>ChewaTalk<span class="identity-sub">Nyanja, one word at a time</span></span>
  </a>
  <nav aria-label="Main">
    <a href="#/" data-nav="home"><svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5C4 4.7 4.7 4 5.5 4H11v15H5.5C4.7 19 4 18.3 4 17.5zM13 4h5.5c.8 0 1.5.7 1.5 1.5v12c0 .8-.7 1.5-1.5 1.5H13z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg><span>Learn</span></a>
    <a href="#/kit" data-nav="kit"><svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 9a3 3 0 0 1 3-3h8a3 3 0 0 1 3 3v9a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2zM9 6V4.5h6V6M5 13h14M10 13v2.5h4V13" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg><span>Survival kit</span></a>

  <div class="hud" aria-label="Your progress">
    <span class="hud-pill" title="Day streak"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2c1 4 5 6 5 11a5 5 0 0 1-10 0c0-2 1-3.5 2-4.5 0 2 1 3 2 3 0-3-1-6 1-9.5z" fill="currentColor"/></svg><b id="hud-streak">0</b></span>

    <button class="hud-sound hud-pets" id="pets-toggle" aria-pressed="true" title="Pets running across the screen">
      <svg viewBox="0 0 24 24" aria-hidden="true"><g fill="currentColor"><ellipse cx="6" cy="10" rx="2.2" ry="2.8"/><ellipse cx="10" cy="6" rx="2.2" ry="2.8"/><ellipse cx="14.5" cy="6" rx="2.2" ry="2.8"/><ellipse cx="18.5" cy="10" rx="2.2" ry="2.8"/><path d="M12 11c3 0 6 4 6 6.5 0 2-1.8 2.5-3 2.5-1.3 0-2-.8-3-.8s-1.7.8-3 .8c-1.2 0-3-.5-3-2.5C6 15 9 11 12 11z"/></g></svg>

    </button>
    <button class="hud-sound" id="sound-toggle" aria-pressed="false" title="Sound effects">

  </div>
</header>

<main id="app" tabindex="-1"></main>

<footer class="wrap site-foot">
  <span>ChewaTalk · Nyanja / Chichewa</span>

</footer>

<div class="cursor-dot" aria-hidden="true"></div>
<div class="cursor-ring" aria-hidden="true"></div>
<div class="toast" role="status" aria-live="polite"></div>

<script type="module" src="js/app.js"></script>

</html>
